---
# Koyeb deployment configuration
app:
  name: autoclicker

services:
  - name: web
    type: web
    instance_type: nano
    regions:
      - was
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    env:
      - name: PORT
        value: "8000"
    health_checks:
      - http:
          path: /health
          port: 8000
          initial_delay_seconds: 30
          period_seconds: 30
          timeout_seconds: 10
          success_threshold: 1
          failure_threshold: 3
    scaling:
      min: 1
      max: 1
    build:
      type: buildpack
      buildpack:
        run_command: gunicorn autoclicker:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
